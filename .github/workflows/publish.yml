name: Publish to NuGet

on:
  release:
    types: [ published ]

permissions:
  contents: read
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Iolys.WebMetrics.slnx

      - name: Test
        run: dotnet test Iolys.WebMetrics.slnx --configuration Release --no-restore

      - name: Pack release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet pack src/Iolys.WebMetrics \
            --configuration Release \
            --no-restore \
            --output artifacts \
            -p:Version="$version"

      - name: Sign in to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish package
        shell: bash
        run: |
          dotnet nuget push "artifacts/Iolys.WebMetrics.${GITHUB_REF_NAME#v}.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json
          dotnet nuget push "artifacts/Iolys.WebMetrics.${GITHUB_REF_NAME#v}.snupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json
