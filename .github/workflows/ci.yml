name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Iolys.WebMetrics.slnx

      - name: Determine package version
        id: version
        shell: bash
        run: |
          version_prefix="$(dotnet msbuild src/Iolys.WebMetrics/Iolys.WebMetrics.csproj -nologo -getProperty:VersionPrefix)"
          version_prefix="${version_prefix//$'\r'/}"

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/develop" ]]; then
            package_version="$version_prefix-preview.$GITHUB_RUN_NUMBER"
            echo "is_preview=true" >> "$GITHUB_OUTPUT"
          else
            package_version="$version_prefix"
            echo "is_preview=false" >> "$GITHUB_OUTPUT"
          fi

          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >-
          dotnet build Iolys.WebMetrics.slnx
          --configuration Release
          --no-restore
          --warnaserror
          -p:Version=${{ steps.version.outputs.package_version }}

      - name: Verify formatting
        run: dotnet format Iolys.WebMetrics.slnx --verify-no-changes

      - name: Test
        run: dotnet test tests/Iolys.WebMetrics.Tests --configuration Release --no-build

      - name: Pack
        run: >-
          dotnet pack src/Iolys.WebMetrics
          --configuration Release
          --no-build
          --output artifacts
          -p:PackageVersion=${{ steps.version.outputs.package_version }}

      - name: Upload preview packages
        if: steps.version.outputs.is_preview == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Iolys.WebMetrics-${{ steps.version.outputs.package_version }}
          path: artifacts/*.*nupkg
          if-no-files-found: error
          retention-days: 14
